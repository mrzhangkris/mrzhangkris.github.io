# Hexo Configuration — English mini-site
# 架构：独立 Hexo 实例，构建产物输出 site-en/public，
# 由主部署工作流合并到主站 /en/ 子路径。
# 新增语言：复制本目录为 site-xx，改 url/root/language 与内容即可。

# Site
title: Zhang Peng's Blog
subtitle: Ops in Practice · Vibe Coding · Essays
description: Zhang Peng's blog: 96 hands-on ops notes re-tested from CentOS 7 to Rocky 9, and 28 write-ups on building things that actually run with AI.
keywords:
  - Zhang Peng
  - blog
  - ops
  - CentOS
  - Rocky Linux
  - Vibe Coding
  - AI Agent
  - indie developer
author: Zhang Peng
language: en
timezone: Asia/Shanghai

# URL — 子路径部署，root 必须带 /en/
url: https://mrzhangkris.github.io/en
root: /en/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
# 与中文站同步：见主站 _config.yml 同项说明（mtime 会让未声明 updated 的文章
# 显示构建时刻作为更新日期）
updated_option: 'date'

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: butterfly

deploy:
  type: ''

feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 30
  content: true
  order_by: -date

sitemap:
  path: sitemap.xml
  rel: false

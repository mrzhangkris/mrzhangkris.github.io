name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ===== 代码质量检查 =====
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: |
          npx markdownlint-cli2 "source/_posts/**/*.md" || true
          echo "Markdown lint completed (non-blocking)"

      - name: Check for broken links (internal)
        run: |
          npx hexo generate --silent
          echo "Build completed, checking internal links..."
          # 简单检查：确保所有内部链接指向存在的页面
          grep -r "href=\"/" source/ --include="*.md" | grep -v "http" | head -20 || true

  # ===== 构建与部署 =====
  build:
    name: Build & Deploy
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ===== 中文主站 =====
      - name: Install dependencies (zh)
        run: npm ci

      - name: Build site (zh)
        run: npx hexo generate

      # ===== 英文子站 =====
      - name: Install pnpm
        run: npm i -g pnpm@12

      - name: Install dependencies (en)
        working-directory: site-en
        run: pnpm install --frozen-lockfile

      - name: Build site (en)
        working-directory: site-en
        run: npx hexo generate

      - name: Merge language sites
        run: |
          mkdir -p merged
          cp -R public/. merged/
          mkdir -p merged/en
          cp -R site-en/public/. merged/en/
          mkdir -p merged/en/img
          cp -R public/img/. merged/en/img/

      # ===== 部署 =====
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./merged

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===== PR 预览（可选） =====
  preview:
    name: PR Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (zh)
        run: npm ci

      - name: Build site (zh)
        run: npx hexo generate

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: public/
          retention-days: 7

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 预览构建完成！可以从 Artifacts 下载查看。'
            })
